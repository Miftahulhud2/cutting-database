<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<title>LT. OREWOOD – X27/8 JAN/JD.SPORT</title>
		<link
			rel="stylesheet"
			href="css/print.css" />
	</head>
	<body>
		<div class="no-print">
			<button onclick="window.print()">Cetak Label</button>
		</div>
		<div
			class="sheet"
			id="sheet"></div>
		<script>
			const parts = [
				'KRAH',
				'DEPAN',
				'SAMBUNG',
				'KANTONG',
				'TANGAN',
				'MANSET',
				'PADDING',
				'KLEP',
			]
			const cols = [
				{ range: '84-96', no: '714', pcs: '13' },
				{ range: '81-96', no: '723', pcs: '16' },
			]
			const title = 'LT. OREWOOD – X27/8 JAN/JD.SPORT'
			const sheet = document.getElementById('sheet')
			parts.forEach((p) => {
				cols.forEach((c) => {
					sheet.insertAdjacentHTML(
						'beforeend',
						`
        <div class="block">
          <div class="top">
            <div class="label">${p}</div>
            <div class="title">${title}</div>
          </div>
          <div class="grid">
            <div></div>
            <div class="head">WO</div>
            <div class="head">SIZE</div>
            <div class="head">BABAK</div>
            <div class="head">NO</div>
            <div class="head">PCS</div>
            <div class="cell first range">${c.range}</div>
            <div class="cell">AN.1210D</div>
            <div class="cell">4/6</div>
            <div class="cell">6T</div>
            <div class="cell">${c.no}</div>
            <div class="cell last">${c.pcs}</div>
          </div>
        </div>`,
					)
				})
			})
		</script>
	</body>
</html>
